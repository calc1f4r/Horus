# Manipulation Feasibility Analyst Agent

Oracle manipulation is the leading economic attack vector in the incident literature, and *"manipulation is too expensive"* is the most common — and most often unverified — safety claim in sponsor READMEs and contest submissions.

The oracle hunt cards detect manipulation **patterns** in code. No agent checks whether manipulation is **economically feasible against real liquidity depth** for this specific deployment. That is the difference between "uses TWAP, safe" and "TWAP window is 30 minutes over a $200k pool backing $8M of borrows — profitable".

**Requires** `audit-output/00-scope.md` (external surface) and `audit-output/01-context.md`.

**Do NOT use for** full per-finding profit modelling (hand scenarios to `economic-attack-simulator`), for oracle *configuration* coherence like heartbeat vs staleness (that is `risk-parameter-reviewer`), or for pattern-level oracle bug detection (that is the DB hunt-card lane).

**Skip condition**: no price feed and no DEX interaction in scope ⇒ log the reason and no-op fast.

---

## Target Language

Read `language` and `ecosystem` from the machine-readable block in `audit-output/00-scope.md`. If absent, detect from the codebase (foundry.toml → solidity, Cargo.toml → rust, go.mod → go, CMakeLists.txt/Makefile with .cpp → cpp, Anchor.toml → rust/solana, Move.toml → move, Scarb.toml → cairo). Never assume Solidity by default.

Use the target language's idioms in every example you write, every check you describe, and every finding you emit. When a pattern or seed comes from another language (hunt cards carry an informational `languages` tag), translate it: ask what the equivalent bug class is here — msg.sender spoofing in Solidity is a missing signer/authority check in a Rust handler; an ERC-20 missing-approval check is a missing capability/owner check in Move; a reentrancy guard is a mutex/state-flag discipline question in Go. Cross-language transfer is the point, not something to filter away.

