## Phase 1: Oracle and Price-Input Inventory

Enumerate **every** price or liquidity input in scope, each with `file:line`. Nothing price-related in `01-context.md` may be left uninventoried — that completeness is this agent's acceptance criterion.

| Input class | What to look for |
|-------------|------------------|
| Spot reads | `slot0()`, `getReserves()`, `balanceOf` ratios, `getAmountOut` |
| TWAP | `observe()`, `consult()`, cumulative-price snapshots — **record the window constant** |
| Chainlink / push feeds | `latestRoundData`, heartbeat, deviation, decimals |
| Pull oracles | Pyth/RedStone update calls, staleness parameters, who pays for updates |
| LST / LRT rates | `getExchangeRate`, `convertToAssets`, `stEthPerToken` |
| Derived prices | Any composite: `priceA / priceB`, cross-pool routes, LP-token pricing |
| Off-chain signers | Signature-gated prices, signer set, replay windows |

For derived prices, record the **full derivation chain** — a composite is only as strong as its weakest leg, and that leg is often a spot read three hops down.

## Phase 2: Consumer Mapping

For each input, enumerate every consumer and the value each consumer controls:

| Consumer | Mechanism | Value at risk |
|----------|-----------|---------------|
| `Pool.liquidate` | seizes collateral at the manipulated price | total collateral × bonus |
| `Vault.deposit` | mints shares priced off the feed | share dilution across TVL |
| `Rewards.weight` | allocates emissions | emissions per epoch |

This sum is the **gain side** of feasibility. Undercounting consumers is the most common way a real finding gets dismissed as unprofitable — trace derived values transitively.

## Phase 3: Manipulation Cost Model

Per input, compute the capital required to move it enough to matter:

```
required_move  = the deviation needed to cross the consumer's threshold
                 (liquidation boundary, mint limit, reward tier)
manipulation_cost = f(pool depth in the crossed range, required_move, fees, holding blocks)
```

By pool type:
- **Constant product**: moving price by factor `p` costs approximately `depth * (sqrt(p) - 1)` on the input leg; the round trip adds the reverse impact plus both swap fees.
- **Concentrated liquidity**: cost is determined by liquidity in the ticks actually crossed. Read tick liquidity — nominal TVL overstates depth, often by an order of magnitude.
- **StableSwap**: the amplification coefficient makes near-peg moves cheap and far-peg moves very expensive; use the invariant.

Every number is sourced on-chain/config or explicitly labelled `ASSUMED`.

## Phase 4: TWAP Feasibility

The claim "TWAP makes it unprofitable" gets checked with arithmetic:

1. Read the **actual window constant** from the target's code — never assume 30 minutes.
2. Compute blocks in the window for the target chain.
3. To shift a TWAP by `d`, the spot price must be held at a larger deviation across a proportion of the window. Compute the required held deviation and its duration.
4. Cost = capital held × blocks × (borrow rate or opportunity cost) + arbitrage losses to other traders each block the price is off-market. The bleed to arbitrageurs usually dominates and must be included.
5. Compare against the Phase 2 gain.

**Verify documented claims**: grep the scope's README and NatSpec for TWAP and manipulation-resistance claims, then check each against the constant actually in the code. A mismatch between the documented window and the deployed window is a finding on its own.

## Phase 5: MEV Exposure Map

Rank user-facing flows by extractability, naming the mechanism:

| Mechanism | What to look for |
|-----------|------------------|
| Sandwich | swaps without slippage parameters, or with a caller-supplied `minOut` defaulted to 0 |
| Backrun | state reveals: lottery draws, rate updates, rebases, oracle pokes |
| Liquidation race | bonus large enough to make racing profitable; first-come liquidation with no dutch decay |
| Rounding / first depositor | vault share rounding, empty-vault donation, dust-amount favourable rounding |
| JIT liquidity | fee capture by liquidity added and removed inside one block |

Rank by value extractable per opportunity × frequency. Report the mechanism, not just the label.

## Phase 6: Feasibility Table and Findings

The table is the primary artifact:

```markdown
| Input | Type | Depth (in-range) | Window | Required capital | Extractable gain | Verdict |
|-------|------|------------------|--------|------------------|------------------|---------|
| `Vault.sol` L142 `slot0` | spot | $190k (ticks crossed, on-chain) | none | $61k | $2.4M (borrows) | **FEASIBLE** |
| `Oracle.sol` L88 `observe` | TWAP | $14M (on-chain) | 1800s (L44) | $9.2M + bleed | $3.1M | not feasible |
| `x/oracle/keeper.rs` L31 median-of-3 | spot | $190k (median source pool) | none | $58k | $1.1M (CDP liquidations) | **FEASIBLE** |
```

Every input gets one of: `FEASIBLE` (gain > cost), `MARGINAL` (within 2×), `NOT FEASIBLE` (cost dominates), `UNVERIFIED (assumption)`.

Findings are written for `FEASIBLE` and `MARGINAL` inputs, plus a separate **assumed-safe-but-unchecked** section listing every documented safety claim that could not be verified — that list is itself valuable to the sponsor.

Emit the oracle-manifest hunt cards to expand (verify IDs against `DB/manifests/huntcards/`), and hand every `FEASIBLE` scenario to `economic-attack-simulator` for full profit modelling.

