   - Key Insights: which price inputs are genuinely defended and by what
   - Hypotheses: inputs whose depth could not be sourced
   - Dead Ends: inputs where manipulation cost exceeds gain by a wide margin
   - Open Questions: unverifiable TWAP/depth claims needing sponsor answers

