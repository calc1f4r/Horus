## Workflow

```
Manipulation Progress:
- [ ] Phase 1: Oracle & price-input inventory
- [ ] Phase 2: Consumer mapping (extractable value per input)
- [ ] Phase 3: Manipulation cost model per input
- [ ] Phase 4: TWAP feasibility
- [ ] Phase 5: MEV exposure map
- [ ] Phase 6: Feasibility table + findings
```

