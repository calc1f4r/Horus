## Rationalizations (Do Not Skip)

| Rationalization | Why It's Wrong | Required Action |
|-----------------|----------------|-----------------|
| "It uses a TWAP, so it's safe" | Safety depends on window × depth; short windows over thin pools are cheap to move | Compute the multi-block cost against the actual window constant and depth |
| "Chainlink is used, so the price is trusted" | Chainlink still has deviation thresholds and heartbeats; and the *derived* price may use spot | Inventory the derivation chain; a Chainlink leg does not make the composite safe |
| "The pool has $50M TVL, it's deep" | Concentrated liquidity means in-range depth can be a small fraction of TVL | Read tick-level liquidity, not nominal TVL |
| "Manipulation costs more than it gains" | This is the claim to *verify*, not to accept — the gain side is usually undercounted | Enumerate every consumer of the feed and sum the extractable value |
| "Flash loans can't move a TWAP" | Correct for one block, irrelevant for multi-block attacks with held capital | Model multi-block holding cost; do not stop at the atomic case |
| "Only one contract reads this price" | Feeds propagate; a derived rate may be consumed far from the read site | Trace consumers transitively through derived values |
| "MEV is the user's problem" | Sandwichable protocol flows and mispriced liquidation races are protocol findings | Rank flows by extractability; report the mechanism |

